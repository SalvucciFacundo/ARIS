# nFPM configuration for ARIS (Debian, RedHat, Alpine, Arch Linux packages)
name: "aris"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "Salvucci Facundo <salvuccifacundo@gmail.com>"
description: "ARIS — Autonomous Reasoner for Image System in pure Go"
vendor: "SalvucciFacundo"
homepage: "https://github.com/SalvucciFacundo/ARIS"
license: "MIT"
contents:
  - src: dist/bin/aris
    dst: /usr/bin/aris
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/aris/README.md
  - src: LICENSE
    dst: /usr/share/doc/aris/LICENSE
