name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build muse (placeholder — will be replaced by Wails build)
        run: |
          mkdir -p dist
          echo "MUSE build placeholder" > dist/muse.txt

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
