name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build aris
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/aris ./cmd/aris/ || echo "Build placeholder" > dist/aris.txt

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
